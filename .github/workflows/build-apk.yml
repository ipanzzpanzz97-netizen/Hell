name: Build CarbonPro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore google-services.json from GitHub Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found. Built-in Cloud AI (Firebase) requires app/google-services.json or the GOOGLE_SERVICES_JSON GitHub Secret."
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CarbonPro-debug.apk

      - name: Upload CarbonPro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarbonPro-debug-apk
          path: dist/CarbonPro-debug.apk
          retention-days: 30
